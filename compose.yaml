name: textreport

services:
  app:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__TextReport: "Host=postgres;Database=textreport;Username=textreport;Password=textreport-dev"
      Smtp__Host: mailpit
      Admin__Username: "${TEXTREPORT_ADMIN_USERNAME:-admin}"
      Admin__Password: "${TEXTREPORT_ADMIN_PASSWORD:-}"
      Ai__ApiKey: "${TEXTREPORT_AI_API_KEY:-}"
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: textreport
      POSTGRES_USER: textreport
      POSTGRES_PASSWORD: textreport-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "textreport", "-d", "textreport"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
