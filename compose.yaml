name: textreport

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: textreport
      POSTGRES_USER: textreport
      POSTGRES_PASSWORD: textreport-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "textreport", "-d", "textreport"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
