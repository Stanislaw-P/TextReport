<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TextReport — анализ текста</title>
    <meta name="description" content="Оставьте заявку на анализ текста в TextReport.">
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/order.js" defer></script>
</head>
<body>
    <main>
        <header>
            <p class="brand">TextReport</p>
            <h1>Анализ текста</h1>
            <p>Отчёт покажет статистику текста, частые слова и слишком длинные предложения.</p>
        </header>
        <form id="order-form" method="post" action="/api/orders">
            <noscript><p>Включите JavaScript, чтобы отправить заявку.</p></noscript>
            <label for="text">Текст для анализа</label>
            <textarea id="text" name="text" rows="8" minlength="20" maxlength="15000"
                      aria-describedby="text-limit privacy text-error" required></textarea>
            <div class="text-meta">
                <small id="text-limit">От 20 до 15 000 символов</small>
                <small id="count">0 / 15 000</small>
            </div>
            <p id="text-error" class="error" hidden></p>
            <p id="privacy" class="hint">Текст может быть передан внешней AI-модели. Не вводите конфиденциальные данные.</p>

            <label for="email">Email для отчёта</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254"
                   aria-describedby="email-error" required>
            <p id="email-error" class="error" hidden></p>

            <div class="actions">
                <button type="submit">Оплатить и получить отчёт</button>
                <small>Тестовая оплата · 100 ₽ · Без списания</small>
            </div>
            <p id="status" role="status"></p>
        </form>
    </main>
</body>
</html>
